function mike(){if(images.happy.complete&&images.happy.naturalWidth){let img=hurt>0?images.sad:images.happy;g.save();g.translate(94,playerY);g.rotate(Math.max(-.25,Math.min(.45,velocity*.055)));if(hurt>0&&t%8<4)g.globalAlpha=.6;let beat=flap>0?1.05:1+Math.sin(t*.28)*.025;g.scale(beat,1);g.drawImage(img,-56,-49,105,67);g.restore();return}g.save();g.translate(94,playerY);g.rotate(Math.max(-.28,Math.min(.48,velocity*.055)));if(hurt>0&&t%8<4)g.globalAlpha=.55;let arm=flap>0?-17:Math.sin(t*.34)*11;
