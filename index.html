<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17142f"><title>Mike's Birthday Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#100d24;color:white;font-family:monospace;overflow:hidden}canvas{display:block;margin:auto;touch-action:none;image-rendering:pixelated}#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;pointer-events:none;opacity:.7}</style></head><body><canvas id="game"></canvas><div id="hint">TOQUE NA TELA PARA VOAR</div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W=360,H=640,mode='start',y=280,vy=0,pipes=[],score=0,lives=3,frame=0,inv=0,spawn=0;function size(){let s=Math.min(innerWidth/360,innerHeight/640);c.width=360;c.height=640;c.style.width=360*s+'px';c.style.height=640*s+'px'}addEventListener('resize',size);size();function reset(){y=280;vy=0;pipes=[];score=0;lives=3;frame=0;inv=0;spawn=0;mode='play'}function tap(e){e.preventDefault();if(mode!=='play'){reset()}else vy=-5.7}c.addEventListener('pointerdown',tap);addEventListener('keydown',e=>{if(e.code==='Space'){tap(e)}});function text(t,px,py,sz=18,col='#fff'){x.fillStyle=col;x.font='bold '+sz+'px monospace';x.textAlign='center';x.fillText(t,px,py)}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function player(){x.save();x.translate(95,y);if(inv&&frame%8<4)x.globalAlpha=.35;rect(-15,-14,30,28,'#ffd0a4');rect(-16,-17,32,9,'#27212c');rect(-10,-3,5,5,'#24202a');rect(5,-3,5,5,'#24202a');rect(-6,9,12,3,'#63372f');rect(-12,15,24,11,'#ef5d73');rect(-18,18,6,6,'#ffd0a4');rect(12,18,6,6,'#ffd0a4');x.restore()}function draw(){frame++;rect(0,0,W,H,'#17142f');for(let i=0;i<34;i++){let sx=(i*83+29)%W,sy=(i*67+17)%440;rect(sx,sy,2,2,i%3?'#746eaa':'#f8df87')}for(let i=0;i<13;i++){let bh=65+(i*41)%140;rect(i*32,H-75-bh,30,bh,'#242344');for(let j=0;j<4;j++)rect(i*32+8,H-65-bh+j*25,5,8,'#e3b35e')}rect(0,H-70,W,70,'#302748');rect(0,H-70,W,6,'#f3bb6b');if(mode==='play'){vy+=.29;y+=vy;if(inv>0)inv--;if(++spawn>=95){spawn=0;pipes.push({px:W+20,gap:145+Math.random()*230,passed:false})}for(let p of pipes){p.px-=2.25;rect(p.px,0,55,p.gap-85,'#5acb99');rect(p.px-4,p.gap-104,63,19,'#2c9b80');rect(p.px,p.gap+85,55,H-p.gap-85,'#5acb99');rect(p.px-4,p.gap+85,63,19,'#2c9b80');if(!p.passed&&p.px+55<80){p.passed=true;score++;if(score>=12)mode='win'}if(!inv&&p.px<111&&p.px+55>79&&(y-14<p.gap-85||y+26>p.gap+85)){lives--;inv=75;vy=-4;if(lives<=0)mode='over'}}pipes=pipes.filter(p=>p.px>-65);if(!inv&&(y<14||y>H-100)){lives--;inv=75;y=Math.max(28,Math.min(y,H-125));vy=-4;if(lives<=0)mode='over'}}player();text('FLAPPY MIKE',180,37,24,'#ffe08a');text('PONTOS '+score+'/12',105,69,14);text('VIDAS '+ '♥'.repeat(lives),275,69,14,'#ff7e99');if(mode!=='play'){rect(22,210,316,220,'#252044');rect(27,215,306,210,'#332953');if(mode==='start'){text('MIKE\'S BIRTHDAY',180,265,22,'#ffe08a');text('QUEST',180,296,27,'#ffe08a');text('FASE 1: FLAPPY MIKE',180,342,16);text('TOQUE PARA JOGAR',180,388,17,'#80edc0')}else if(mode==='over'){text('GAME OVER',180,278,32,'#ff8799');text('PONTOS: '+score,180,327,19);text('TOQUE PARA TENTAR',180,384,16,'#80edc0')}else{text('FASE CONCLUÍDA!',180,270,24,'#ffe08a');text('VOCÊ SALVOU O MIKE!',180,317,16);text('FASE 2 EM BREVE',180,360,17,'#80edc0');text('TOQUE PARA REJOGAR',180,395,13)}}requestAnimationFrame(draw)}draw();
</script></body></html>
