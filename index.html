<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#19162a"><title>FLAPPY MIKE — CUBATÃO</title><style>*{box-sizing:border-box}html,body{margin:0;background:#100e1b;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}canvas{display:block;margin:auto;touch-action:none}#note{position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;text-align:center;color:#ffce72;font:700 10px system-ui;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="note">CUBATÃO É NÓIS • TOQUE PARA VOAR</div><script>
const c=document.getElementById('g'),ctx=c.getContext('2d'),W=360,H=640;
const files={bg:'cubatao.jpg',happy:'mike-feliz.png',sad:'mike-triste.png',pipe:'tubo.jpg',concrete:'concreto.jpg',tree:'tronco.jpg'};
const assets={};for(let [k,v] of Object.entries(files)){assets[k]=new Image();assets[k].src='assets/'+v}
let mode='menu',y=300,vy=0,score=0,hearts=3,inv=0,frame=0,spawn=0,pipes=[],birds=[],flap=0,parallax=0;
function resize(){let sc=Math.min(innerWidth/W,innerHeight/H);c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);c.style.width=W*sc+'px';c.style.height=H*sc+'px'}addEventListener('resize',resize);resize();
function text(s,x,y,size=18,color='#fff'){ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#161321';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y)}
function img(k,x,y,w,h){let i=assets[k];if(i.complete&&i.naturalWidth)ctx.drawImage(i,x,y,w,h)}
function reset(){mode='play';y=280;vy=-4;score=0;hearts=3;inv=0;spawn=0;pipes=[];birds=[]}
function tap(e){if(e)e.preventDefault();if(mode==='pause'){mode='play';return}if(mode!=='play'){reset();return}vy=-5.25;flap=13}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),xx=(e.clientX-r.left)/r.width*W,yy=(e.clientY-r.top)/r.height*H;if(mode==='play'&&xx>310&&yy<70){mode='pause';return}tap(e)});addEventListener('keydown',e=>{if(e.code==='Space')tap(e);if(e.code==='Escape')mode=mode==='play'?'pause':'play'});
function hit(){if(inv)return;hearts--;inv=80;vy=-3;if(hearts<=0)mode='over'}
function background(){ctx.fillStyle='#322443';ctx.fillRect(0,0,W,H);img('bg',-12,0,384,640);let shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,'rgba(10,8,29,.24)');shade.addColorStop(.7,'rgba(15,11,20,0)');shade.addColorStop(1,'rgba(6,11,15,.38)');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H)}
function pipe(p,top){let edge=top?p.gap-88:p.gap+88;let hh=top?edge:H-edge;ctx.save();if(top){ctx.translate(0,edge);ctx.scale(1,-1);img(p.kind,p.x,0,58,hh)}else img(p.kind,p.x,edge,58,hh);ctx.restore();ctx.fillStyle='#29362f';ctx.fillRect(p.x-3,top?edge-10:edge,64,11);ctx.fillStyle='#d1a66a';ctx.fillRect(p.x-3,top?edge-10:edge,64,3)}
function ibis(b){ctx.save();ctx.translate(b.x,b.y);ctx.scale(.8,.8);ctx.fillStyle='#e72c36';ctx.beginPath();ctx.ellipse(0,0,12,5,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-13,-12-Math.sin(frame*.25)*8);ctx.lineTo(7,-4);ctx.fill();ctx.fillStyle='#f9a05c';ctx.fillRect(11,-1,11,2);ctx.restore()}
function mike(){ctx.save();ctx.translate(91,y);ctx.rotate(Math.max(-.24,Math.min(.4,vy*.045)));if(inv&&frame%8<4)ctx.globalAlpha=.5;let bob=flap>0?-.05:Math.sin(frame*.22)*.025;ctx.translate(0,bob*45);img(inv?'sad':'happy',-53,-37,107,70);ctx.restore()}
function panel(title,subtitle,button){ctx.fillStyle='rgba(12,14,29,.90)';ctx.fillRect(18,205,324,228);ctx.strokeStyle='#f8c057';ctx.lineWidth=2;ctx.strokeRect(18,205,324,228);text(title,180,267,title.length>16?21:31,'#ffd25a');text(subtitle,180,318,13,'#f4e8d8');ctx.fillStyle='#ffbb32';ctx.fillRect(44,356,272,52);text(button,180,389,17,'#16141c')}
function loop(){frame++;background();if(mode==='play'){vy+=.28;y+=vy;if(flap>0)flap--;if(inv>0)inv--;let speed=2.2+Math.floor(score/5)*.44;if(++spawn>Math.max(75,103-Math.floor(score/5)*7)){spawn=0;pipes.push({x:390,gap:170+Math.random()*235,kind:['pipe','concrete','tree'][Math.floor(Math.random()*3)],passed:false})}for(let p of pipes){p.x-=speed;if(!p.passed&&p.x+58<70){p.passed=true;score++;if(score>=15)mode='win'}if(p.x<116&&p.x+58>67&&(y-30<p.gap-88||y+28>p.gap+88))hit()}if(y<37||y>570){y=Math.max(37,Math.min(y,570));hit()}}
for(let p of pipes){pipe(p,true);pipe(p,false)}pipes=pipes.filter(p=>p.x>-70);if(frame%135===0)birds.push({x:390,y:80+Math.random()*400});for(let b of birds){b.x-=1.15;ibis(b)}birds=birds.filter(b=>b.x>-30);mike();
ctx.fillStyle='rgba(8,12,24,.55)';ctx.fillRect(0,0,360,74);for(let j=0;j<3;j++)text(j<hearts?'♥':'♡',25+j*27,34,25,j<hearts?'#ff5367':'#797589');text(score+'/15',180,35,26,'#fff5d9');text('VELOCIDADE '+(1+Math.floor(score/5)),180,56,10,'#ffdc89');ctx.fillStyle='#11192a';ctx.fillRect(314,9,37,39);text('Ⅱ',333,37,25);
if(mode==='menu')panel('FLAPPY MIKE','CUBATÃO • 3 VIDAS • 15 OBSTÁCULOS','TOQUE PARA JOGAR');
if(mode==='over')panel('GAME OVER','O MIKE FICOU TRISTE :(','TENTAR NOVAMENTE');
if(mode==='win')panel('FASE CONCLUÍDA!','VOCÊ PASSOU POR CUBATÃO!','JOGAR NOVAMENTE');
if(mode==='pause')panel('PAUSADO','DESCANSANDO OS BRAÇOS','CONTINUAR');
requestAnimationFrame(loop)}loop();
</script></body></html>
