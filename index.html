<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#191633"><title>Flappy Mike • Cubatão</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121125;font-family:monospace}canvas{display:block;touch-action:none;image-rendering:pixelated;margin:auto}#footer{position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;text-align:center;color:#ffdc8d;font:bold 10px monospace;pointer-events:none;opacity:.8}</style></head><body><canvas id="game"></canvas><div id="footer">CUBATÃO É NÓIS ♥</div><script>
const C=document.getElementById('game'),g=C.getContext('2d'),W=360,H=640;let state='menu',t=0,score=0,lives=3,playerY=290,velocity=0,obstacles=[],spawn=0,hurt=0,shake=0,flap=0,birds=[],particles=[];const R=(a,b)=>a+Math.random()*(b-a),box=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))};function label(s,x,y,size=16,color='#fff'){g.font='900 '+size+'px monospace';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#17132c';g.strokeText(s,x,y);g.fillStyle=color;g.fillText(s,x,y)}function resize(){let s=Math.min(innerWidth/W,innerHeight/H);C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);C.style.width=W*s+'px';C.style.height=H*s+'px'}addEventListener('resize',resize);resize();
function start(){state='play';score=0;lives=3;playerY=280;velocity=-4;obstacles=[];spawn=0;hurt=0;birds=[];particles=[]}function tap(e){e.preventDefault();if(state==='menu'||state==='over'||state==='win')start();else if(state==='play'){velocity=-5.1;flap=12;for(let i=0;i<3;i++)particles.push({x:66,y:playerY+R(-8,8),vx:R(-2,-.3),vy:R(-2,2),life:15})}else if(state==='pause')state='play'}C.addEventListener('pointerdown',e=>{if(state==='play'&&e.offsetX*C.width/C.clientWidth>305&&e.offsetY*C.height/C.clientHeight<75){state='pause';return}tap(e)});addEventListener('keydown',e=>{if(e.code==='Space'){tap(e)}if(e.code==='Escape')state=state==='play'?'pause':'play'});
function hill(points,c){g.fillStyle=c;g.beginPath();g.moveTo(0,H);for(let p of points)g.lineTo(p[0],p[1]);g.lineTo(W,H);g.fill()}function background(){let sky=g.createLinearGradient(0,0,0,550);sky.addColorStop(0,'#302454');sky.addColorStop(.45,'#b64d68');sky.addColorStop(.73,'#fa9650');sky.addColorStop(1,'#edb16e');g.fillStyle=sky;g.fillRect(0,0,W,H);box(272,260,52,52,'#ffbd66');for(let i=0;i<23;i++)box((i*83+23)%360,(i*43+13)%215,2,2,'#f6cf9b');hill([[0,250],[30,220],[64,236],[98,205],[142,252],[195,238],[240,271],[360,242]],'#543b62');hill([[0,340],[30,300],[65,290],[98,318],[142,335],[180,350],[360,343]],'#294a4e');for(let i=0;i<18;i++){let xx=185+i*11,ht=R(28,110);box(xx,382-ht,8,ht,'#383044');box(xx+2,382-ht-11,3,12,'#383044');if(i%3===0)box(xx+3,382-ht-20,15,7,'#594355');for(let j=0;j<3;j++)box(xx+3,375-j*13,2,2,'#ffbc6d')}for(let i=0;i<8;i++){let xx=i*54+8,yy=365+(i%3)*14;box(xx,yy,31,12,'#433649');box(xx+7,yy-23,7,23,'#433649');box(xx+11,yy-35,3,13,'#433649')}hill([[0,380],[34,355],[55,365],[88,331],[112,365],[145,405],[190,421],[360,430]],'#1c4d4a');for(let i=0;i<27;i++){let xx=(i*37)%184,yy=335+(i*19)%115;box(xx,yy,18,13,i%2?'#286b50':'#215943');box(xx+4,yy-9,11,13,'#2f7953')}for(let i=0;i<3;i++){let xx=30+i*25;box(xx,395,20,128,'#b5d6db');for(let j=0;j<12;j++)box(xx+((j*11)%18),405+j*10,4,9,'#eefaff')}box(0,523,360,117,'#1e5360');for(let i=0;i<40;i++)box((i*43+t*.35)%370,536+(i*17)%100,16,2,i%2?'#e3a96d':'#5fabb0');box(0,606,360,34,'#1c393f');for(let i=0;i<10;i++)box(i*38,606,7,35,'#536c5b');box(0,605,360,5,'#637a5d');label('CUBATÃO',78,290,15,'#e3d6bd')}
function ibis(x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);box(-10,-2,19,6,'#f04448');box(2,-8,9,6,'#f44e4c');box(10,-6,10,2,'#f9a354');box(-4,-9,12,5,'#ed373f');box(-14,-13,10,7,'#f34b46');box(-12,5,9,4,'#f05a55');box(7,-6,2,2,'#211a31');g.restore()}function pipe(x,edge,top){let yy=top?0:edge,h=top?edge:640-edge;box(x,yy,53,h,'#184e43');box(x+5,yy,11,h,'#3b8061');box(x+43,yy,6,h,'#0c342f');for(let j=0;j<h;j+=34){box(x+1,yy+j,51,3,'#133e37');box(x+9,yy+j+7,6,3,'#6c9b63')}let lip=top?edge-15:edge;box(x-5,lip,63,17,'#17493d');box(x,lip+3,51,6,'#639b6b');box(x+42,lip+3,10,12,'#0d352f');if(top)box(x+25,edge-43,3,9,'#a97e58')}
function mike(){let yy=playerY;g.save();g.translate(94,yy);let angle=Math.max(-.35,Math.min(.6,velocity*.06));g.rotate(angle);if(hurt>0&&t%8<4)g.globalAlpha=.55;let arm=flap>0?-14:Math.sin(t*.3)*9;box(-24,0,26,15,'#171b2c');box(-18,12,12,10,'#e8edf2');box(-3,13,12,8,'#e8edf2');box(-25,14,13,5,'#f17b65');box(-5,17,13,4,'#f17b65');box(-20,-7,9,9,'#22283c');box(-20,-8+arm,8,17,'#30374d');box(-22,-8+arm,7,6,'#e9b28d');box(1,-6-arm*.4,10,18,'#30374d');box(6,8-arm*.4,7,6,'#e9b28d');box(-7,-28,35,33,'#dba17e');box(-9,-31,39,12,'#f6bd21');box(-5,-39,30,13,'#e6a716');box(-9,-26,39,6,'#ffcf3e');box(22,-17,4,5,'#191c25');box(11,-18,4,5,'#191c25');box(12,-22,5,2,'#392c29');box(22,-22,5,2,'#392c29');box(8,-8,22,11,'#3b2526');box(11,-6,16,4,'#6d3a2c');if(hurt>0){box(13,-10,11,3,'#f8c3ae');box(15,-10,7,2,'#392a2c');box(11,-20,7,2,'#392a2c');box(22,-20,6,2,'#392a2c')}else{box(12,-7,14,4,'#fff0d6');box(12,-10,14,3,'#713d37')}g.restore()}
function collision(){if(hurt>0)return;lives--;hurt=90;shake=12;velocity=-3.5;if(lives<=0){state='over';hurt=120}}
function panel(title,sub,cta){box(21,215,318,222,'#15182e');box(26,220,308,212,'#30294b');box(26,220,308,5,'#f1b74f');label(title,180,275,title.length>18?19:27,'#ffcd60');label(sub,180,327,14,'#f4ebdc');box(52,365,256,44,'#ffbd45');box(56,369,248,36,'#f3a735');label(cta,180,393,16,'#262034')}
function draw(){t++;g.save();if(shake>0){g.translate(R(-3,3),R(-3,3));shake--}background();if(t%145===0)birds.push({x:390,y:R(110,450),speed:R(1,1.8)});for(let b of birds){b.x-=b.speed;ibis(b.x,b.y,.8)}birds=birds.filter(b=>b.x>-40);if(state==='play'){velocity+=.27;playerY+=velocity;if(flap>0)flap--;if(hurt>0)hurt--;if(++spawn>105){spawn=0;obstacles.push({x:380,gap:R(180,415),done:false})}for(let p of obstacles){p.x-=2.25;if(!p.done&&p.x+53<73){p.done=true;score++;if(score===12)state='win'}if(p.x<117&&p.x+53>70&&(playerY-35<p.gap-90||playerY+23>p.gap+90))collision()}if(playerY<39||playerY>570){playerY=Math.max(40,Math.min(570,playerY));collision()}}for(let p of obstacles){pipe(p.x,p.gap-90,true);pipe(p.x,p.gap+90,false)}obstacles=obstacles.filter(p=>p.x>-65);for(let p of particles){box(p.x,p.y,4,3,'#fff1c5');p.x+=p.vx;p.y+=p.vy;p.life--}particles=particles.filter(p=>p.life>0);mike();g.restore();for(let i=0;i<3;i++)label(i<lives?'♥':'♡',24+i*29,34,26,i<lives?'#ff6677':'#65536c');label(score+'/12',180,35,26,'#fff4d2');ibis(277,28,.8);box(322,10,29,29,'#171a2c');label('Ⅱ',337,32,19,'#fff');if(state==='menu')panel('FLAPPY MIKE','CUBATÃO • FASE 1','TOQUE PARA JOGAR');if(state==='over')panel('GAME OVER','O MIKE FICOU TRISTE :(','TENTAR NOVAMENTE');if(state==='win')panel('FASE CONCLUÍDA!','12 OBSTÁCULOS SUPERADOS','JOGAR NOVAMENTE');if(state==='pause')panel('PAUSADO','DESCANSANDO OS BRAÇOS','TOQUE PARA VOLTAR');requestAnimationFrame(draw)}draw();
</script></body></html>
